<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>関数</title>
</head>
<body>
    <p><button onclick="showgreetings();">挨拶</button></p>
    <p id="result"></p>
    <script>
        function greetings(){
            const today = new Date()
            const hour =today.getHours()
            if (hour >=5 && hour < 9)return"おはようございます"
            else if(hour<18)return"こんにちは"
            else return"こんばんは"
        }
        function showgreetings(){
            document.getElementById('result').innerHTML = greetings
        }
    </script>
    
</body>
</html>
