<!DOCTYPE html>
<html lang="ja">
<head>

    <title>電卓</title>
</head>
<body>
    <input id='n1' type="text">
    <input id='n2' type="text">
    <button onclick="calc('+')">+</button>
    <button onclick="calc('-')">-</button>
    <button onclick="calc('*')">*</button>
    <button onclick="calc('/')">/</button>
    <p id = 'result'></p>
    <script>
        function calculateResult(op1,op2,operator){
            let result=0
            switch(operator){
                case'+':
                result = op1+op2
                break
                case'-':
                result = op1-op2
                break
                case'*':
                result = op1*op2
                break
                case'/':
                result = op1/op2 
                break
                default:
                throw new SyntaxError(
                    '演算子は「+,-,*,/」の中から選んでください')

            }
            return result
        }

      const a = Number(n1.value)
      const b = Number(n2.value)
      ans.innerHTML = calculateResult(a, b, op)
       } 
    </script>
    
</body>
</html>
