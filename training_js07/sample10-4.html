<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素数</title>
</head>
<body>
    <p>consoleで素数かどうかの確認</p>
    <script>
        const n =100 //上限
        for(let i = 2;  i<=n;  i++){
            if(!isPrime(i))continue //素数でなければ続ける
            console.log(i)
        }
        function isPrime(n){ //√n
            if(n<=3){
                return n>1 //素数
            }else if(n%2 ===0 ||n%3 ===0 ){ //2や3で割って余りが0なら素数ではない
                return false //素数ではない
            }
            i=5
            while(i**2<=n){ //iが√n以下の間繰り返す
                if(n%i === 0 || n%(i+2)===0){ //割り切れたらnは素数ではない
                    return false
                }
                i += 6 //素数を1つも漏らさずに無駄な倍数を飛ばせるのが6 2と3の最小公倍数
            }
            return true
        }
    </script>
    
</body>
</html>
