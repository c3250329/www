<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配列の利用</title>

    <style>

    </style>
</head>
<body>
    <h1>利用料の計算</h1>
    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>料金（a）</th>
               <th>人数（b）</th>
              <th>a×b</th> 
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>0</th>
                <td>500</td>
                <td>10</td>
                <td><button onclick="multiply_0();">利用料の合計</button></td>
            </tr>
            <tr>
                <th>1</th>
                <td>980</td>
                <td>16</td>
                <td><button onclick="multiply_1();">利用料の合計</button></td>
            </tr>
            <tr>
                <th>2</th>
                <td>1200</td>
                <td>8</td>
                <td><button onclick="multiply_2();">利用料の合計</button></td>
            </tr>
         </tbody>
       <script>
                let answer = [5000,15680,9600];
                function multiply_0(){
                    alert('答えは、'+ answer[0] +'です');
                }
                function multiply_1(){
                    alert('答えは、'+ answer[1] +'です');
                }
                function multiply_0(){
                    alert('答えは、'+ answer[2] +'です');
                }
            </script>
    </table>
    
</body>
</html>
