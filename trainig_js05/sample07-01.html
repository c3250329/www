<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>変数の利用</title>
</head>
<body>
    <h1>変数の演算</h1>
    <p>a=10、b=4の場合</p>
    <button onclick="add();">足し算</button>
    <button onclick="subtract();">引き算</button>
    <button onclick="multiply();">掛け算</button>
    <button onclick="divide();">割り算</button>

    <script>
        let answer = [14,6,40,2.5];
        function add(){
            alert('答えは'+ answer[0] +'です');
        }
        function subtract(){
            alert('答えは'+ answer[1] +'です');
        }
        function multiply(){
            alert('答えは'+ answer[2] +'です');
        }
        function divide(){
            alert('答えは'+ answer[3] +'です');
        }
    </script>
    
</body>
</html>
