 <!DOCTYPE html>
 <html lang="ja">

 </head>
 <body>
    <h3>問題</h3>
    <p>日本の首都は？ <button onclick="showanser()">解答を見る</button></p>

            let anser  = 東京;
            alert(anser);
        }
    </script>
 </body>
