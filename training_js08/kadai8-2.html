<!DOCTYPE html>

<html lang="ja">

<head>
<meta charset="UTF-8">
<title>要素の追加と削除</title>
</head>

<body>
<h1>写真の一覧</h1>
<p>以下のボタンをクリックすると、写真が一覧表示されます。</p>
<div id="photos">
  <button id="show_button" onclick="showPhotos()">写真を表示</button>
</div>

<script>
function showPhotos() {
  let photoBox = document.getElementById('photos');
  photoBox.insertAdjacentHTML('afterbegin', '<img src="image/photo_1.jpg">');
  photoBox.insertAdjacentHTML('afterbegin', '<img src="image/photo_2.jpg">');
  photoBox.insertAdjacentHTML('afterbegin', '<img src="image/photo_3.jpg">');
  photoBox.insertAdjacentHTML('afterbegin', '<img src="image/photo_4.jpg">');
  photoBox.insertAdjacentHTML('afterbegin', '<img src="image/photo_5.jpg">');
  photoBox.insertAdjacentHTML('afterbegin', '<img src="image/photo_6.jpg">');
  photoBox.insertAdjacentHTML('afterbegin', '<img src="image/photo_7.jpg">');
  photoBox.insertAdjacentHTML('afterbegin', '<img src="image/photo_8.jpg">');
  document.getElementById('show_button').remove();
}
</script>

</body>

</html>
