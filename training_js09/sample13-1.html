<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>繰り返し処理</title>
    <style>
        table{
            border-collapse: collapse;
        }
        td,th{
            border: solid 1px #000000;
            width: 40px;
            padding: 5px;
            text-align: center;
        }
        th{
            background-color: #99cccc;
        }
    </style>
</head>
<body onload="createTable()">
    <h1>九九の表</h1>
    <table>
        <thead id="t_head"></thead>
        <tbody id="t_body"></tbody>
    </table>

    <script>
        function createTable(){
            //ヘッダー行の作成
            let row = '<tr><th></th>';
                for(let j=1;j<=9;j++){//1~9の見出しを作成
                    row = row+'<th>'+j+'</th>';
                }
                row =row+'</tr>';//行の終了タグ
                document.getElementById('t_head').insertAdjacentHTML('beforeend',row)//一番上の作成

                //データの作成
                for(let i=1;i<=9;i++){
                    let row ='<tr><th>'+i+'</th>';//各行の先頭を作成
                    for(let j=1;j<=9;j++){
                        row = row+'<td>'+i*j+'</td>';//掛け算の結果を１行ずつ追加
                    }
                    row=row+'</tr>';
                    document.getElementById('t_body').insertAdjacentHTML('beforeend',row)
                }
        }
    </script>
    
</body>
</html>
