<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>要素の取得と内容の変更</title>
    <style>
        #message{
            color: red;
            display: inline;
        }
    </style>
</head>
<body>
    <h1>座席の予約</h1>
    <p>東京会場</p><p id="message"><strong>（予約受付中）</strong></p>
    <p id="btn"><button onclick="showAnser();">予約する</button></p>

    <script>
        function showAnser(){
        let anserBox = document.getElementById('message');
        anserBox.innerHTML = '<strong>（予約済み）</strong>';
        document.getElementById('btn').innerHTML = '<strong>ありがとうございました。</strong>'
        }
    </script>
    
</body>
</html>
